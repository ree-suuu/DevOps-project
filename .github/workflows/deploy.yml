name: Deploy Web Application (CloudFormation + SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      instance_type:
        description: EC2 instance type
        default: t2.micro
        type: choice
        options: [t2.micro, t2.small, t2.medium, t3.micro, t3.small, t3.medium]

env:
  AWS_REGION: us-east-1
  STACK_NAME: klay-fullstack-stack

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install & Build Frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation Stack (Create or Update EC2)
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file infra/ec2-instance.yaml \
            --parameter-overrides InstanceType="${{ inputs.instance_type || 't2.micro' }}" \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}

      - name: Retrieve EC2 Public IP and Key
        id: server-info
        run: |
          IP=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" \
            --output text)
          echo "EC2_IP=$IP" >> $GITHUB_OUTPUT
          echo "Server Public IP: $IP"

          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)

          # Auto-recovery: If instance was stopped (e.g. by AWS lab timer), start it
          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Current instance state: $STATE"
          if [ "$STATE" = "stopping" ]; then aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"; STATE=stopped; fi
          if [ "$STATE" = "stopped" ]; then aws ec2 start-instances --instance-ids "$INSTANCE_ID" > /dev/null; fi
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

          # Re-fetch IP in case it changed on start
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "EC2_IP=$IP" >> $GITHUB_OUTPUT

          SSM_PATH=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='SSMKeyPath'].OutputValue" \
            --output text)
          aws ssm get-parameter \
            --name "$SSM_PATH" \
            --with-decryption \
            --region ${{ env.AWS_REGION }} \
            --query "Parameter.Value" \
            --output text > /tmp/server-key.pem
          chmod 600 /tmp/server-key.pem

      - name: Wait for SSH Availability
        run: |
          IP=${{ steps.server-info.outputs.EC2_IP }}
          echo "Waiting for SSH on $IP..."
          for i in $(seq 1 36); do
            if nc -zw5 "$IP" 22 2>/dev/null; then
              echo "SSH port 22 is open!"
              exit 0
            fi
            echo "Waiting for SSH ($i/36)..."
            sleep 10
          done
          echo "Timed out waiting for SSH."
          exit 1

      - name: Transfer Project Bundle to EC2
        env:
          IP: ${{ steps.server-info.outputs.EC2_IP }}
        run: |
          tar -czf /tmp/app-bundle.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='backend/node_modules' \
            .
          scp -i /tmp/server-key.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/app-bundle.tar.gz ubuntu@"$IP":/tmp/app-bundle.tar.gz

      - name: Deploy Code & Restart Services via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EC2_IP: ${{ steps.server-info.outputs.EC2_IP }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ steps.server-info.outputs.EC2_IP }}
          username: ubuntu
          key_path: /tmp/server-key.pem
          script_stop: true
          envs: EC2_IP,MONGODB_URI,JWT_SECRET
          script: |
            echo ">>> [1/6] Waiting for cloud-init instance bootstrap..."
            sudo cloud-init status --wait || true

            echo ">>> [2/6] Unpacking application bundle..."
            mkdir -p /var/www/app
            tar -xzf /tmp/app-bundle.tar.gz -C /var/www/app
            rm -f /tmp/app-bundle.tar.gz

            echo ">>> [3/6] Installing backend dependencies..."
            cd /var/www/app/backend
            npm ci --omit=dev

            echo ">>> [4/6] Generating server .env file..."
            printf "%s\n" \
              "PORT=5000" \
              "NODE_ENV=production" \
              "CLIENT_URL=http://$EC2_IP" \
              "MONGODB_URI=$MONGODB_URI" \
              "JWT_SECRET=$JWT_SECRET" \
              > /var/www/app/backend/.env

            echo ">>> [5/6] Configuring Nginx reverse proxy..."
            sudo cp /var/www/app/infra/nginx.conf /etc/nginx/sites-available/app
            sudo ln -sf /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx

            echo ">>> [6/6] Reloading PM2 backend process..."
            cd /var/www/app/backend
            pm2 delete all 2>/dev/null || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save

      - name: Print Live Web Application URL
        run: |
          IP=${{ steps.server-info.outputs.EC2_IP }}
          echo "### 🎉 Website is live at http://$IP" >> "$GITHUB_STEP_SUMMARY"
          echo "🎉 Website is live at http://$IP"
          echo "API Health check: http://$IP/api/health"

      - name: Clean up temporary SSH key
        if: always()
        run: rm -f /tmp/server-key.pem /tmp/app-bundle.tar.gz
